# Jenkins 主控台的全部設定。${...} 由 docker-compose 從 .env 帶進來，密碼不寫在這裡。
jenkins:
  systemMessage: "anki-white-forge CI"
  # 主控台本身不跑建置，一律派給工作機（Docker 裡是 Linux，跑不了 Mac 的 Anki）
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  nodes:
    - permanent:
        name: "mac"
        labelString: "mac anki"
        numExecutors: 1
        remoteFS: "${MAC_AGENT_WORKDIR}"
        launcher:
          inbound:
            webSocket: true
        retentionStrategy: "always"
  # 失敗通知的收件人做成全域變數，Jenkinsfile 只讀變數，信箱不進 git
  globalNodeProperties:
    - envVars:
        env:
          - key: "NOTIFY_EMAIL"
            value: "${NOTIFY_EMAIL:-}"

unclassified:
  location:
    url: "http://localhost:18080/"
    # 寄件人；iCloud 只接受用登入的那個帳號當寄件人
    adminAddress: "anki-white-forge CI <${SMTP_USERNAME:-}>"
  mailer:
    # iCloud 的寄信伺服器：587 port、STARTTLS。密碼是 Apple 帳號的 App 專用密碼
    smtpHost: "smtp.mail.me.com"
    smtpPort: "587"
    useTls: true
    useSsl: false
    charset: "UTF-8"
    authentication:
      username: "${SMTP_USERNAME:-}"
      password: "${SMTP_PASSWORD:-}"
  gitHubPluginConfig:
    # GitHub 送來的 webhook 要用這組密鑰驗簽名，驗不過就丟掉。
    # 密鑰本身在網頁的 Credentials 裡（id 如下），不寫在這個檔案。
    hookSecretConfigs:
      - credentialsId: "github-webhook-secret"

jobs:
  - script: >
      pipelineJob('anki-white-forge') {
        properties {
          pipelineTriggers {
            triggers {
              // 主要：GitHub push 後經 webhook 通知
              githubPush()
              // 補漏：Docker 沒開時漏掉的 push，開機後由輪詢補跑
              pollSCM { scmpoll_spec('H/15 * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Kilin945/anki-white-forge.git') }
                branch('*/${JENKINS_BRANCH}')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
