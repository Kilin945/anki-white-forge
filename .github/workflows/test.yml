name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # --locked: uv.lock 跟 pyproject.toml 對不上就失敗，不偷偷改版本
      - run: uv sync --locked
      - run: uv run pytest -q
