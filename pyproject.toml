[project]
name = "anki-word-adder"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pyspellchecker>=0.9.0",
    "groq>=1.2.0",
    "edge-tts>=7.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." 讓測試 import 得到 addon／core／根目錄的 CLI；"tools" 讓 test_script_imports 與 test_zh_chars import 得到 check_simplified
pythonpath = [".", "tools"]

[tool.uv]
# uv 版本寫死，本機、Jenkins 由 uv 自己檢查，GitHub Actions 的 setup-uv 照這個版本安裝
required-version = "==0.13.0"
